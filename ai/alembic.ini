# Alembic 설정 파일.
#
# 이 파일은 alembic 명령(`alembic upgrade head` 등) 이 동작할 때 읽는 INI 파일이다.
# 마이그레이션 명령은 ai/ 디렉토리에서 실행한다:
#   alembic heads              # 현재 head 리비전 확인
#   alembic upgrade head       # 미적용 마이그레이션을 모두 적용
#   alembic revision -m "..."  # 새 빈 리비전 파일 생성 (수동 작성)
#
# 실제 마이그레이션 코드는 ai/alembic/versions/ 에 들어간다.
# 협업 규칙(누가 어떤 리비전 번호를 점유하는지 등) 은 ai/AGENTS.md 의
# "Alembic 마이그레이션 규칙" 섹션에서 다룬다.

[alembic]
# 마이그레이션 스크립트가 위치할 디렉토리 (ai/alembic/ 의 상대경로).
script_location = alembic

# alembic 명령 실행 시 sys.path 의 첫 항목으로 ai/ 가 추가된다.
# 이 덕분에 env.py 안에서 `from app.config.settings import ...` 가 동작한다.
prepend_sys_path = .

# DB 연결 URL.
# 실제 값은 env.py 가 settings.sync_database_url 로 override 한다.
# 여기 값은 alembic 내부 검증이 빈 문자열을 거부하기 때문에 둔 placeholder 일 뿐이다.
sqlalchemy.url = driver://placeholder

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
