- id: ADR-001
  title: Web E2E 테스트 — Playwright 채택
  status: adopted
  date: 2026-05-24
  stacks: [nextjs, playwright]
  context: |
    web 모듈에는 `web/tests/*.test.mjs` 기반의 정적/계약성 테스트가 이미 있지만,
    실제 브라우저에서 로그인, 보호 라우트 접근, 폼 입력, 권한별 UI 노출, 파일 업로드 같은 사용자 흐름을
    검증하는 E2E 테스트 기준은 아직 문서화되어 있지 않다.
    AX-WMS 프론트엔드는 Next.js App Router와 client component 상호작용이 많고,
    회귀는 단일 함수보다 여러 화면 전환과 API 응답 조합에서 발생하기 쉽다.
  decision: |
    브라우저 E2E 테스트 도구는 Playwright로 표준화한다.
    E2E 테스트는 사용자가 실제로 수행하는 핵심 경로를 보호하는 용도로만 작성하고,
    단순 유틸 함수나 순수 렌더링 분기는 기존 `web/tests/*.test.mjs` 또는 더 작은 테스트에서 다룬다.
    Playwright 설정과 테스트 코드는 web 모듈 안에 둔다.
    기본 테스트 위치는 `web/e2e/`로 하고, 공통 로그인/세션/fixture/helper는 `web/e2e/_support/`에 둔다.
    테스트 데이터는 재실행 가능해야 하며, seed 또는 API fixture로 준비한다.
    외부 운영 환경에 직접 쓰기 테스트를 실행하지 않고, 로컬 또는 테스트 전용 환경을 대상으로 한다.

    우선 작성할 E2E 범위는 다음으로 제한한다.
    1. 인증: 로그인 성공, 로그인 실패, 로그아웃, 보호 라우트 미인증 리다이렉트.
    2. 대시보드: 역할별 진입 화면, 주요 카드/바로가기 노출, 스코프 전환.
    3. 조직 관리: 부서/팀 목록 조회, 생성/수정 폼 유효성, 상세 화면 이동.
    4. 사용자 관리: 사용자 목록/상세, 내 정보 수정, 역할별 액션 버튼 노출 여부.
    5. 업무일지: 목록 필터, 생성/수정, 상태 전이, 태그/파일 첨부 UI 흐름.
    6. 파일: 파일 목록 조회, 업로드 성공/실패 피드백, 다운로드 버튼 노출.
    7. 알림: 알림 목록, 읽음 처리, 필터, SSE 수신 시 UI 갱신.
    8. 검색/태그: 통합 검색 결과 표시, 태그 병합 핵심 흐름.
  consequence: |
    핵심 사용자 흐름은 실제 브라우저 기준으로 회귀 보호된다.
    테스트 수가 과도하게 늘지 않도록 E2E는 happy path와 권한/오류 대표 케이스 중심으로 유지한다.
    Playwright 도입 시 `@playwright/test` 의존성, 브라우저 설치, 로컬 API/AI 서버 또는 mock API 전략이 필요하다.
    CI에서는 E2E 전용 job으로 분리하고, 실패 시 trace/screenshot/video artifact를 남긴다.
