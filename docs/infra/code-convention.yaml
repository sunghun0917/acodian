# infra 모듈의 단일 source of truth 코드 컨벤션 파일.
general:
  - id: GEN-001
    rule: 인프라 문서는 과거의 일회성 검증 절차가 아니라, 현재 운영 기준인 EC2 + GitLab CI/CD 배포 흐름을 기준으로 설명한다.
    stacks: [infra, ec2, gitlab]
  - id: GEN-002
    rule: 민감정보(DB_PASSWORD, JWT_SECRET, SSH 키 등)는 커밋되는 YAML/Markdown에 실제 값으로 하드코딩하지 않는다. 저장소에는 샘플 파일(infra/.env.example)만 두고 실제 값은 EC2 `.env` 또는 GitLab CI/CD Variables 로 주입한다.
    stacks: [infra, docker, compose, gitlab]
  - id: GEN-003
    rule: 배포 절차나 브랜치 정책을 바꾸면 `.gitlab-ci.yml`, `infra/compose.deploy.yml`, `docs/infra/ec2-gitlab-cicd-guide.md`, `docs/infra/adr.yaml`을 함께 점검해 문서 drift를 남기지 않는다.
    stacks: [infra, gitlab, docs]
  - id: GEN-004
    rule: '`infra/.env.example` 는 서버 `.env` 샘플이 아니라 compose 렌더, `infra_validate`, 로컬 스모크 테스트를 위한 기본값 파일로 설명한다. 환경 특화 값과 실제 비밀값은 이 파일에 넣지 않고 EC2 `.env` 또는 GitLab CI/CD Variables 로만 주입한다.'
    stacks: [infra, docker, compose, ci]

docker:
  - id: DO-001
    rule: API 컨테이너 이미지는 `api/Dockerfile`을 사용하고, Dockerfile 은 build/libs/*.jar 만 복사하는 외부 빌드 방식을 유지한다. EC2 서버에서 소스 빌드를 수행하는 방향으로 우회하지 않는다.
    stacks: [docker, springboot, gitlab]
  - id: DO-002
    rule: '`api/.dockerignore`는 실행에 필요한 JAR만 허용하는 화이트리스트 방식으로 유지한다. 소스코드, .git, 로컬 설정 파일을 이미지 빌드 컨텍스트에 포함하지 않는다.'
    stacks: [docker]
  - id: DO-003
    rule: '웹(Next.js) 컨테이너 이미지는 `web/Dockerfile` 을 사용하고 빌드 컨텍스트는 모노레포 루트로 둔다. pnpm workspace 의 lockfile 무결성과 hoisted 의존성 추적을 위해 `pnpm-lock.yaml`, `pnpm-workspace.yaml`, 루트 `package.json` 이 컨텍스트에 포함되어야 한다. 빌드는 `deps`(pnpm install --frozen-lockfile) → `builder`(`pnpm --filter ./web build`) → `runner`(Next.js standalone 산출물 + `.next/static` 만 복사) 의 multi-stage 로 분리한다. runner stage 는 non-root user 로 동작한다. 근거는 ADR-014.'
    stacks: [docker, nextjs, pnpm]
  - id: DO-004
    rule: '모노레포 루트 `.dockerignore` 는 web/Dockerfile 빌드 컨텍스트(=모노레포 루트) 에서만 적용된다. api 빌드는 컨텍스트가 `api/` 이므로 `api/.dockerignore` 가 우선이며 본 파일과 분리된 SSOT 다. 두 파일을 동기화하지 말고 영역별로 독립 관리한다. 근거는 ADR-014.'
    stacks: [docker]

compose:
  - id: CMP-001
    rule: EC2 배포용 compose source of truth 는 `infra/compose.deploy.yml` 하나로 유지한다. 동일 목적의 중복 compose 파일을 추가하지 않는다.
    stacks: [compose, ec2]
  - id: CMP-002
    rule: '`api` 서비스는 `postgres`, `redis`에 대해 `depends_on: condition: service_healthy` 를 사용한다. 시작 순서만 보장하는 느슨한 구성으로 완화하지 않는다.'
    stacks: [compose, postgres, redis]
  - id: CMP-003
    rule: postgres 데이터는 환경별 named volume(`axwms-${APP_ENV}-postgres-data`)에 저장한다. staging/production 데이터를 같은 volume 이름으로 공유하지 않는다.
    stacks: [compose, postgres]
  - id: CMP-004
    rule: 운영 compose 는 `build:` 대신 Registry 이미지 변수(`API_IMAGE`)를 사용한다. CI 와 서버가 서로 다른 방식으로 애플리케이션 이미지를 해석하지 않게 한다.
    stacks: [compose, docker, gitlab]

ops:
  - id: OPS-001
    rule: EC2 운영 문서는 `/opt/axwms/{staging|production}` 디렉터리 구조, `.env` 위치, Nginx 포트 연결, GitLab Variables 를 초심자도 따라 할 수 있게 단계별로 설명해야 한다.
    stacks: [ec2, nginx, gitlab]
  - id: OPS-002
    rule: '`master`는 production 배포 브랜치로 간주하고 protected branch 로 유지한다. `dev`도 staging 자동배포에 필요한 protected variable 정책을 고려해 운영한다.'
    stacks: [gitlab, ec2]
  - id: OPS-003
    rule: 배포 후 자동 검증이 필요하면 현재 운영 경로에 맞는 health check 또는 서비스 상태 확인으로 설계하되, 과거 임시 검증 절차를 운영 표준처럼 재사용하지 않는다.
    stacks: [ec2, gitlab, springboot]
  - id: OPS-004
    rule: 컨테이너 내부 listen 포트와 호스트 바인딩 포트는 8000–9000 범위 안에서 고정한다(web 8000, api 8100, ai 8200, postgres 8300/8301, redis 8400/8401). Nginx 진입 포트(production 80/443, staging 8080/8443) 는 이 규칙의 예외로 허용한다. 근거는 ADR-010.
    stacks: [ec2, nginx, compose]
  - id: OPS-005
    rule: GitLab CI 가 사용하는 SSH 키는 개인 접속 키와 분리된 전용 키페어로 운영한다. 키 회수/재발급 시 GitLab `SSH_PRIVATE_KEY` 와 EC2 `authorized_keys` 를 동시에 갱신해 두 쪽이 어긋나지 않게 한다.
    stacks: [ec2, gitlab, security]
  - id: OPS-006
    rule: GitLab CI/CD Variables 는 모두 Protected 로 등록한다. 값에 `$` 문자가 섞일 수 있는 `SSH_PRIVATE_KEY`, `SSH_KNOWN_HOSTS` 는 "Expand variable reference" 를 비활성화한다. 이미지 레지스트리 자격증명(`GHCR_USER`, `GHCR_TOKEN`) 은 GitHub 개인 계정 username 과 classic PAT 을 값으로 넣고 `GHCR_TOKEN` 에는 Mask 를 적용한다.
    stacks: [gitlab, ci, security]
  - id: OPS-007
    rule: GitLab Runner(`gitlab-runner`) 는 EC2 에 docker executor 로 등록하고 `[runners.docker]` 섹션의 `privileged = true` 를 유지한다. `api_ci` / `api_image` 가 DinD service 를 요구하므로 privileged 를 비활성화하지 않는다. Runner 는 "Lock to current projects" 로 프로젝트 전용으로 운영한다.
    stacks: [gitlab, runner, docker]
  - id: OPS-008
    rule: '`.gitlab-ci.yml` 의 `cache.key.files` 는 GitLab 제약(최대 2개) 에 맞춰 최대 2개까지만 지정한다. Gradle 기반 job 은 `api/gradle/libs.versions.toml` 과 `api/build.gradle` 두 파일을 기본 조합으로 쓰고, 추가 파일이 필요해지면 files 를 늘리지 말고 cache key 전략 자체를 재설계(prefix + checksum 조합 등) 한다.'
    stacks: [gitlab, ci]
  - id: OPS-009
    rule: 한 EC2 에 staging/production 이 공존하므로 staging 의 호스트 포트는 production 호스트 포트 +1 오프셋으로 고정한다. 예 — api production `127.0.0.1:8100:8100` / staging `127.0.0.1:8101:8100`, postgres production `8300:5432` / staging `8301:5432`, redis production `8400:6379` / staging `8401:6379`. Nginx listen(production 80/443, staging 8080/8443) 은 이 오프셋 규칙의 예외다. 근거는 ADR-010.
    stacks: [ec2, compose, nginx]
  - id: OPS-010
    rule: web/api/ai 컨테이너는 호스트 바인딩을 `127.0.0.1:` 로 제한해 외부에서 Nginx 를 우회한 직접 접근을 차단한다. Nginx 는 같은 호스트에서 `proxy_pass http://127.0.0.1:<port>` 로 upstream 을 연다. DB 컨테이너(postgres/redis) 는 개발 편의(ADR-011) 를 위해 `0.0.0.0` 바인딩을 유지하고, 대신 OPS-011 의 비밀번호 정책으로 완화한다. 근거는 ADR-010.
    stacks: [compose, nginx, security]
  - id: OPS-011
    rule: '`DB_PASSWORD` 는 staging/production 각각 별도의 강한 무작위 값(최소 24자, 대소문자·숫자·기호 혼합) 으로 관리한다. ADR-011 로 DB 가 외부 개방되어 비밀번호가 유일한 1차 방어선이므로 재사용·예측 가능 패턴·기본값 복사를 금지한다. 운영 저장소는 GitLab CI/CD Variables(`DB_PASSWORD_STAGING`, `DB_PASSWORD_PRODUCTION`) 를 Protected + Mask 로 유지하고 서버 `.env` 에만 주입한다. 근거는 ADR-011.'
    stacks: [security, postgres, gitlab]
  - id: OPS-012
    rule: 'CI/CD Variable 신규 등록·값 변경 시 ADR-013 의 5단계 검증을 수행한 증거를 MR 에 남긴다. 순서는 (1) `.gitlab-ci.yml` 참조명 `grep`, (2) UI Key 필드 키보드 직접 타이핑 + 좌우 끝 공백 재확인, (3) 간접 probe(`${VAR+yes}` / `${#VAR}` / `env | awk /^PREFIX/`) 로 주입 확인, (4) Masked 조건(단일 줄·최소 8자·허용 문자) 준수 확인, (5) Protected · Environment scope 정합 확인. 육안 확인만으로 "등록 완료" 를 승인하지 않는다.'
    stacks: [gitlab, ci, security]
  - id: OPS-013
    rule: 'PEM 기반 Variable(`SSH_PRIVATE_KEY` 등) 은 `-----BEGIN ... -----` 로 시작하고 `-----END ... -----` 뒤에 반드시 LF 개행이 포함된 상태로 저장한다. 개행은 LF 고정이며 CRLF 또는 trailing newline 누락은 `libcrypto` 파싱 실패를 일으킨다. multi-line 값은 Masked 를 켜지 않고 "Expand variable reference" 도 비활성화한다. Windows 메모장·웹 편집기 경유를 피하고 서버 `cat` 결과를 그대로 붙여넣는다.'
    stacks: [gitlab, ci, ssh, security]
  - id: OPS-014
    rule: 'feature 브랜치는 `git checkout --no-track -b <name> <start>` 로 생성하여 upstream 이 `origin/dev` 로 자동 설정되는 함정을 피한다. `git pull` 은 rebase 방식을 유지하며 MR 브랜치가 target 보다 뒤처지면 GitLab UI 의 "rebase source branch" 또는 로컬 `git rebase` + `--force-with-lease` 로 정합한다. 이미 원격에 push 된 커밋은 revert/rewrite 로 지우지 않고 forward commit 으로 정리한다.'
    stacks: [git, ops]
  - id: OPS-015
    rule: 'CI 디버그용 probe 는 값 자체를 어떤 형태(echo · log · 파일) 로도 노출하지 않고 길이(`${#VAR}`) · 정의 여부(`${VAR+yes}`) · 이름 목록(`env | awk /^PREFIX/`) 만 사용한다. 진단이 끝난 probe 라인은 동일 MR 또는 후속 MR 로 반드시 제거하고, MR 설명에 probe 실행 결과 발췌를 남겨 OPS-012 의 검증 증거로 사용한다.'
    stacks: [gitlab, ci, security]
  - id: OPS-016
    rule: '배포 스크립트 `infra/scripts/remote-deploy.sh` 는 멱등성을 보장한다. `up -d` 전에 `compose rm -sf api web` 를 실행해 기존 애플리케이션 컨테이너(api/web)의 포트 점유를 선해제하고, `up -d --remove-orphans` 로 프로젝트에 속하지 않은 잔존 컨테이너를 정리한다. 배포 전·후 `compose ps` 스냅샷을 job log 에 남겨 실패 시 추적성을 확보한다. 2차 이후 배포에서 구 컨테이너가 `restart: unless-stopped` 로 포트를 쥔 채 새 컨테이너 bind 실패 → 컨테이너 네트워크 고립 → 무한 재시작 루프에 빠지는 사고를 방지하기 위함이다. 향후 ai 편입 시 동일 패턴으로 `pull` / `rm -sf` / `up -d` 인자 목록을 일괄 확장한다(ADR-014 에서 web 편입 시 적용된 일반화 규약).'
    stacks: [compose, gitlab, ec2]
  - id: OPS-017
    rule: 'Nginx conf 의 SSOT 는 저장소의 `infra/nginx/sites-available/axwms.conf` 와 `infra/nginx/snippets/proxy-headers.conf` 다. EC2 의 `/etc/nginx/sites-available/axwms.conf` 또는 `/etc/nginx/snippets/proxy-headers.conf` 를 SSH 로 직접 수정하지 않는다. 변경은 PR 리뷰 후 `deploy_dev` / `deploy_prod` job 이 `scp + sudo install + nginx -t + systemctl reload` 한 줄로 자동 동기화한다. drift 가 발견되면 저장소 conf 가 우선이며 EC2 측을 덮어쓴다. 근거는 ADR-015.'
    stacks: [nginx, ec2, gitlab]
  - id: OPS-018
    rule: 'Nginx 배포의 sudoers 권한은 deploy user 의 `/etc/sudoers.d/axwms-deploy` 에 NOPASSWD 로 다음 5개 명령만 등록한다 — `/usr/bin/install -o root -g root -m 0644 /tmp/axwms.conf /etc/nginx/sites-available/axwms.conf`, `/usr/bin/install -o root -g root -m 0644 /tmp/proxy-headers.conf /etc/nginx/snippets/proxy-headers.conf`, `/usr/bin/mkdir -p /etc/nginx/snippets`, `/usr/sbin/nginx -t`, `/usr/bin/systemctl reload nginx`. `ALL=(ALL) NOPASSWD: ALL` 같은 광역 부여를 사용하지 않는다(권한 최소화). 등록 후 `sudo visudo -c` 로 문법 검증을 수행한 증거를 운영 기록에 남긴다. 근거는 ADR-015.'
    stacks: [nginx, ec2, security]
