general:
  - id: GEN-001
    rule: 함수는 단일 책임 원칙을 따른다. 50줄을 넘으면 분리를 검토한다.
    stacks: [springboot]
  - id: GEN-002
    rule: 매직 넘버를 사용하지 않는다. 상수로 선언한다.
    stacks: [springboot]
  - id: GEN-003
    rule: DB 테이블명은 tb_ 접두 + snake_case. DB 컬럼명은 snake_case. Java 필드는 camelCase로 선언하고 @Column(name="...") 으로 매핑한다.
    stacks: [springboot]
  - id: GEN-004
    rule: 응답 포맷은 고정. 성공 { success:true, data:{...}, timestamp:"ISO8601" } / 에러 { success:false, error:{code, message, statusCode}, timestamp:"ISO8601" }
    stacks: [springboot]

springboot:
  - id: SB-001
    rule: Controller는 요청/응답 변환만 담당한다. 비즈니스 로직은 Service에 둔다.
    stacks: [springboot]
  - id: SB-002
    rule: Controller에서 Entity를 직접 반환하지 않는다. 항상 DTO로 변환 후 반환한다.
    stacks: [springboot]
  - id: SB-003
    rule: DTO에 Bean Validation 어노테이션(@NotNull, @NotBlank, @Size 등)을 반드시 적용한다. Controller에서 @Valid로 검증한다.
    stacks: [springboot]
  - id: SB-004
    rule: 의존성 주입은 생성자 주입(@RequiredArgsConstructor + final 필드)만 사용한다. @Autowired 필드 주입 금지.
    stacks: [springboot]
  - id: SB-005
    rule: Entity에 public 기본 생성자와 setter를 남발하지 않는다. 생성은 정적 팩토리 메서드, 변경은 도메인 메서드로 처리한다. @NoArgsConstructor(access = AccessLevel.PROTECTED) 사용.
    stacks: [springboot]
  - id: SB-006
    rule: Service 클래스에 @Transactional(readOnly = true)를 기본 선언한다. 쓰기(CUD) 메서드에만 @Transactional을 추가한다.
    stacks: [springboot]
  - id: SB-007
    rule: 에러는 반드시 BusinessException(ErrorCode.XXX)을 throw한다. RuntimeException이나 임의 문자열 throw 금지.
    stacks: [springboot]
  - id: SB-008
    rule: GlobalResponseAdvice가 응답 래핑을 자동 처리한다. Controller에서 ApiResponse 수동 래핑 금지.
    stacks: [springboot]
  - id: SB-009
    rule: 권한 체크는 @PreAuthorize("hasRole('ROLE_NAME')")로 Controller 메서드에 선언한다. 데이터 소유권 체크(부서 소속 등)는 Service에서 CustomUserPrincipal로 처리한다.
    stacks: [springboot]
  - id: SB-010
    rule: DB 마이그레이션은 Flyway로 관리한다. 수동 SQL 직접 실행 금지. 마이그레이션 파일(V{version}__{description}.sql)은 반드시 커밋한다.
    stacks: [springboot]
  - id: SB-011
    rule: 민감정보(JWT_SECRET, DB_PASSWORD 등)는 환경변수로 관리한다. application.yml에 하드코딩 금지. application-local.yml은 .gitignore에 포함.
    stacks: [springboot]
  - id: SB-012
    rule: |
      테스트 네이밍 규칙.
      클래스명: {Subject}Test (단위), {Subject}IntegrationTest (통합).
      메서드: @DisplayName("should {기대결과} when {조건}") 사용.
      그룹핑: @Nested 클래스로 시나리오별 묶기.
      예시: @DisplayName("should throw exception when email is duplicated")
    stacks: [springboot]
  - id: SB-013
    rule: |
      DTO 네이밍 패턴.
      API 전용 DTO는 유스케이스 기준의 {UseCase}Api 외부 클래스에 모은다.
      각 API 클래스는 static nested class Request, Response 두 개를 기본으로 둔다.
      예: CreateUserApi.Request, CreateUserApi.Response, GetWorklogDetailApi.Response.
      UseCase 이름은 컨트롤러 메서드명 복제가 아니라 API 유스케이스 기준으로 정한다.
      Request는 Controller 바인딩/검증 전용으로 두고, Service 입력은 toCommand()/toCriteria()로 변환한다.
      Response는 from()/of() 정적 팩토리 메서드로 생성한다.
      공용 DTO가 필요한 경우에만 {동작}{Entity}Request, {Entity}{뷰}Response, {Entity}ListQuery 패턴을 사용한다.
    stacks: [springboot]
  - id: SB-014
    rule: |
      Audit 필드 패턴.
      모든 변경 가능 엔티티에 createdAt, updatedAt 필수.
      Hibernate @CreationTimestamp, @UpdateTimestamp 사용.
      필요 시 createdBy, updatedBy 추가하고 Spring Security SecurityContext에서 주입.
    stacks: [springboot]
  - id: SB-015
    rule: |
      DTO 변환 명시성 컨벤션.
      API 요청/응답 DTO 변환은 자동 매핑 도구를 기본 규칙으로 도입하지 않는다.
      Request는 Controller 바인딩/검증 전용으로 두고 toCommand(), toCriteria() 등 명시적 메서드로 Service 입력 객체로 변환한다.
      Response는 from(), of() 정적 팩토리 메서드로 생성한다.
      Request DTO를 Entity로 직접 매핑하지 않는다.
      Entity 생성/수정은 Service 또는 Domain의 책임으로 둔다.
      필드 복사 로직이 필요하더라도 우선 명시적 코드로 작성하고, 실제 중복 문제가 확인될 때만 별도 추상화를 검토한다.
    stacks: [springboot]
  - id: SB-016
    rule: |
      JOOQ 사용 컨벤션.
      단순 CRUD(findById, save, findAll 등)는 Spring Data JPA Repository를 사용한다.
      복잡한 동적 쿼리(다중 조건 필터, 집계, 다중 테이블 JOIN)는 JOOQ를 사용한다.
      JOOQ 쿼리 클래스는 infrastructure/jooq/ 패키지에 배치.
      인터페이스: {Entity}JooqRepository. 구현: {Entity}JooqRepositoryImpl.
      Spring Data JPA의 Custom Repository 패턴으로 메인 Repository가 JooqRepository를 extends.
      DSLContext는 생성자 주입(@RequiredArgsConstructor + final)으로 사용한다.
      build/generated/sources/jooq/ 의 생성 클래스는 직접 수정하지 않는다 (jooqGenerate 재실행으로 재생성).
    stacks: [springboot]
  - id: SB-017
    rule: |
      모듈 간 의존성 규칙.
      다른 모듈의 domain/ 및 infrastructure/ 패키지를 직접 import하지 않는다.
      모듈 간 조회는 해당 모듈의 application/ 서비스를 통해서만 접근한다.
      support/는 모든 모듈에서 사용 가능하지만, support가 다른 모듈에 의존하면 안 된다.
      허용된 모듈 의존 방향: auth→organization, worklog→organization/tag, file→worklog/organization, notification→organization, dashboard→organization/worklog/notification.
    stacks: [springboot]
  - id: SB-018
    rule: |
      Controller Docs 인터페이스 패턴.
      모든 컨트롤러는 Swagger 명세를 담당하는 Docs 인터페이스를 구현한다.
      인터페이스 네이밍: {Module}ControllerDocs (예: AuthControllerDocs, WorklogControllerDocs).
      배치: 구현체 Controller와 동일한 presentation/ 패키지.

      인터페이스({Module}ControllerDocs)가 담당하는 어노테이션:
        - 클래스: @Tag(name, description)
        - 메서드: @Operation(summary, description), @ApiResponses, @SecurityRequirement
        - 파라미터: @Parameter — Security 파라미터(CustomUserPrincipal)는 @Parameter(hidden = true)로 숨김

      구현체({Module}Controller)가 담당하는 어노테이션:
        - 클래스: @RestController, @RequestMapping, @RequiredArgsConstructor
        - 메서드: @GetMapping / @PostMapping / @PutMapping / @PatchMapping / @DeleteMapping, @PreAuthorize, @Override
        - 파라미터: @Valid, @RequestBody, @PathVariable, @RequestParam, @AuthenticationPrincipal

      OpenAPI 보안 스킴(bearerAuth)은 support/config/OpenApiConfig.java에서 전역 등록한다.
    stacks: [springboot]
