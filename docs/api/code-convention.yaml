# API 모듈의 단일 source of truth 코드 컨벤션 파일.
general:
  - id: GEN-001
    rule: 함수는 단일 책임 원칙을 따른다. 50줄을 넘으면 분리를 검토한다.
    stacks: [springboot]
  - id: GEN-002
    rule: 매직 넘버를 사용하지 않는다. 상수로 선언한다.
    stacks: [springboot]
  - id: GEN-003
    rule: DB 테이블명은 tb_ 접두 + snake_case. DB 컬럼명은 snake_case. Java 필드는 camelCase로 선언하고 @Column(name="...") 으로 매핑한다.
    stacks: [springboot]
  - id: GEN-004
    rule: 응답 포맷은 고정. 성공 { success:true, data:{...}, timestamp:"ISO8601" } / 에러 { success:false, error:{code, message, statusCode}, timestamp:"ISO8601" }
    stacks: [springboot]

springboot:
  - id: SB-001
    rule: Controller는 요청/응답 변환만 담당한다. 비즈니스 로직은 Service에 둔다.
    stacks: [springboot]
  - id: SB-002
    rule: Controller에서 Entity를 직접 반환하지 않는다. 항상 DTO로 변환 후 반환한다.
    stacks: [springboot]
  - id: SB-003
    rule: DTO에 Bean Validation 어노테이션(@NotNull, @NotBlank, @Size 등)을 반드시 적용한다. Controller에서 @Valid로 검증한다.
    stacks: [springboot]
  - id: SB-004
    rule: 의존성 주입은 생성자 주입(@RequiredArgsConstructor + final 필드)만 사용한다. @Autowired 필드 주입 금지.
    stacks: [springboot]
  - id: SB-005
    rule: Entity에 public 기본 생성자와 setter를 남발하지 않는다. 생성은 정적 팩토리 메서드, 변경은 도메인 메서드로 처리한다. @NoArgsConstructor(access = AccessLevel.PROTECTED) 사용.
    stacks: [springboot]
  - id: SB-006
    rule: |
      Service 클래스에 @Transactional(readOnly = true)를 기본 선언한다. 쓰기(CUD) 메서드에만 @Transactional을 추가한다.
      조회/쓰기 책임을 기계적으로 `*QueryService`, `*CommandService` 로 분리하지 않는다.
      기본 서비스 네이밍은 `{Domain}Service` 를 사용하고, 조회 최적화가 필요하면 같은 Service의 readOnly 메서드와 `repository/jooq`, `readmodel` 로 해결한다.
      `dashboard` 처럼 도메인 자체가 read-only 여도 서비스 이름을 `*QueryService` 로 강제하지 않는다.
    stacks: [springboot]
  - id: SB-007
    rule: 에러는 반드시 BusinessException(ErrorCode.XXX)을 throw한다. RuntimeException이나 임의 문자열 throw 금지.
    stacks: [springboot]
  - id: SB-008
    rule: GlobalResponseAdvice가 응답 래핑을 자동 처리한다. Controller에서 ApiResponse 수동 래핑 금지.
    stacks: [springboot]
  - id: SB-009
    rule: 권한 체크는 @PreAuthorize("hasRole('ROLE_NAME')")로 Controller 메서드에 선언한다. 데이터 소유권 체크(부서 소속 등)는 Service에서 CustomUserPrincipal로 처리한다.
    stacks: [springboot]
  - id: SB-010
    rule: DB 마이그레이션은 Flyway로 관리한다. 수동 SQL 직접 실행 금지. 마이그레이션 파일(V{version}__{description}.sql)은 반드시 커밋한다.
    stacks: [springboot]
  - id: SB-011
    rule: 민감정보(JWT_SECRET, DB_PASSWORD 등)는 환경변수로 관리한다. application.yml에 하드코딩 금지. application-local.yml은 .gitignore에 포함.
    stacks: [springboot]
  - id: SB-012
    rule: |
      테스트 계층/네이밍 규칙.
      Unit Test: Spring 없이 순수 로직을 검증한다. 클래스명은 {Subject}Test.
      Smoke/Context Test: 최소 Spring Boot 기동만 검증한다. `application-test.yml` + `@ActiveProfiles("test")` 를 기본으로 사용하고, DB/JPA/Flyway/Redis 같은 인프라 성공 여부를 책임지지 않는다.
      Integration Test: 실제 PostgreSQL/Redis(Testcontainers)와 함께 Repository/Service/JPA/Flyway wiring 을 검증한다. 클래스명은 {Subject}IntegrationTest, 공통 기반은 IntegrationTestSupport 와 `application-integration.yml` + `@ActiveProfiles("integration")` 를 우선 사용한다.
      E2E Test: MockMvc 기반이라도 full Spring context + Security + Service + DB/Redis 연동을 포함한 백엔드 API end-to-end 검증으로 취급한다. 클래스명은 {Subject}E2eTest, 공통 기반은 E2eTestSupport 와 `application-e2e.yml` + `@ActiveProfiles({"integration","e2e"})` 를 우선 사용한다.
      JPA-aware 공통 설정(`@EnableJpaAuditing` 등)은 JPA 인프라가 있을 때만 활성화되도록 구성해 smoke/context 테스트와 충돌시키지 않는다.
      메서드 @DisplayName 은 한국어로 작성한다. 패턴은 `@DisplayName("{조건}이면 {기대결과}한다")` 를 기본으로 하고, 조건이 없으면 `@DisplayName("{기대결과}한다")` 형태를 사용한다.
      예 - `@DisplayName("이메일이 중복되면 예외를 던진다")`, `@DisplayName("payload 가 없으면 빈 성공 응답을 만든다")`.
      @Nested 클래스의 @DisplayName 은 그룹을 가리키는 한국어 명사구로 작성한다(예 - `"성공 응답 팩토리"`, `"유효성 검증"`).
      클래스·메서드 식별자(`{Subject}Test` 클래스명, JUnit 메서드명) 와 영문 기술 식별자(클래스/필드/예외명 등)는 영어 그대로 유지한다.
      테스트 코드도 주석 컨벤션을 따른다. @DisplayName 이 WHAT 을 충분히 설명하므로 같은 내용을 한국어로 다시 적는 WHAT 주석은 금지한다. 다만 fixture 가 특정 값을 쓰는 이유, 시나리오가 검증하려는 도메인 제약, 비자명한 setup/순서, 의도적으로 검증을 생략한 부분 같은 WHY 가 코드만으로 드러나지 않으면 한국어 한 줄 주석으로 남긴다.
    stacks: [springboot]
  - id: SB-013
    rule: |
      DTO 네이밍 패턴.
      API 전용 DTO는 유스케이스 기준의 {UseCase}ApiDto 외부 클래스에 모은다. 한 유스케이스는 한 `{UseCase}ApiDto` 파일 1:1 매핑을 기본으로 한다.
      각 API 클래스는 static nested class Request, Response 를 기본으로 두고, Service 가 반환하는 출력 record 도 같은 `{UseCase}ApiDto` 안의 `Result` 로 모아 둔다.
      특정 record(Request/Response/Result) 안에서만 의미 있는 보조 record(예 - Response 안의 `User`, Result 안의 `UserContext`) 는 `{UseCase}ApiDto` 바깥 레벨이 아닌 **해당 부모 record 내부 중첩 record** 로 배치해 "의미 소유자" 와 "파일 위치" 를 일치시킨다. 여러 record 가 공유하는 보조 record 만 `{UseCase}ApiDto` 바로 아래 중첩으로 둔다.
      예: CreateUserApiDto.Request, CreateUserApiDto.Response, LoginApiDto.Response.User, LoginApiDto.Result, LoginApiDto.Result.UserContext.
      UseCase 이름은 컨트롤러 메서드명 복제가 아니라 API 유스케이스 기준으로 정한다.
      Request는 Controller 바인딩/검증 겸 Service 입력 DTO 로 그대로 재사용한다. 별도 Command/Criteria 클래스를 기본으로 만들지 않는다.
      Service 가 여러 소스를 조립·정규화한 입력이 필요하거나 HTTP 가 아닌 경로(배치, 이벤트, 내부 호출)가 동일 유스케이스를 호출해야 하는 경우에 한해 `{UseCase}ApiDto.Command` / `{UseCase}ApiDto.Criteria` 같은 추가 nested record 를 같은 Api 클래스 안에 둔다. 단순 1:1 필드 매핑에는 도입하지 않는다.
      Response는 from()/of() 정적 팩토리 메서드로 생성한다.
      공용 DTO가 필요한 경우에만 {동작}{Entity}Request, {Entity}{뷰}Response, {Entity}ListQuery 패턴을 사용한다.
      단, internal callback 또는 private integration DTO처럼 공개 API DTO 컨벤션 바깥에 있어야 하는 제한된 경우에는 top-level DTO를 허용한다.
      이 예외는 일반 public API DTO나 임의의 shared DTO로 확장하지 않는다.
      이 경우 naming은 `Internal{UseCase}Request`, `Internal{UseCase}Response` 패턴을 사용한다.
    stacks: [springboot]
  - id: SB-014
    rule: |
      Audit 필드 패턴.
      모든 변경 가능 엔티티에 createdAt, updatedAt 필수.
      Hibernate @CreationTimestamp, @UpdateTimestamp 사용.
      필요 시 createdBy, updatedBy 추가하고 Spring Security SecurityContext에서 주입.
    stacks: [springboot]
  - id: SB-015
    rule: |
      DTO 변환 명시성 컨벤션.
      API 요청/응답 DTO 변환은 자동 매핑 도구를 기본 규칙으로 도입하지 않는다.
      Request 는 Controller 바인딩/검증과 Service 입력을 겸하며, 기본적으로 Service 메서드는 Request DTO 를 그대로 인자로 받는다.
      Request 값을 가공해 Service 입력을 만들어야 할 때에만 `{UseCase}Command` / `{UseCase}Criteria` 같은 별도 record 를 `dto/` 아래에 두고 사용한다.
      Response는 from(), of() 정적 팩토리 메서드로 생성한다.
      Request DTO를 Entity로 직접 매핑하지 않는다.
      Entity 생성/수정은 Service 또는 Domain의 책임으로 둔다.
      필드 복사 로직이 필요하더라도 우선 명시적 코드로 작성하고, 실제 중복 문제가 확인될 때만 별도 추상화를 검토한다.
    stacks: [springboot]
  - id: SB-016
    rule: |
      JOOQ 사용 컨벤션.
      단순 CRUD(findById, save, findAll 등)는 Spring Data JPA Repository를 사용한다.
      복잡한 동적 쿼리(다중 조건 필터, 집계, 다중 테이블 JOIN)는 JOOQ를 사용한다.
      JOOQ 공통 설정/생성 클래스는 global/jooq/ 아래에 둔다.
      도메인 쿼리 클래스는 domain/{module}/repository/jooq/ 패키지에 배치한다.
      인터페이스: {Entity}JooqRepository. 구현: {Entity}JooqRepositoryImpl.
      Spring Data JPA의 Custom Repository 패턴으로 메인 Repository가 JooqRepository를 extends.
      DSLContext는 생성자 주입(@RequiredArgsConstructor + final)으로 사용한다.
      generated jOOQ canonical path는 `api/src/generated/jooq/main/java` 이며, `src/main/java` 와 분리된 generated-only 루트로 관리한다.
      codegen은 직접 generateJooq를 호출하지 않고 `./gradlew jooqGenerate` 진입점으로만 실행한다.
      로컬 `build`/`bootRun`/`test`/`assemble` 와 CI는 generated source가 없거나 stale 하면 compile 이전에 `jooqGenerate` 를 선행 보장하는 방향으로 운영한다.
      stale 판정은 migration 파일뿐 아니라 `api/build.gradle`, `api/gradle/jooq-codegen.gradle`, `api/gradle.properties` 같은 codegen 입력 변경도 함께 반영한다.
      Flyway migration을 변경한 개발자는 `./gradlew jooqGenerate` 또는 표준 build entrypoint로 codegen 성공 여부를 먼저 확인하되, generated source를 커밋하지 않는다.
      `jooqGenerate` 는 PostgreSQL bootstrap 기반 codegen lane이며, generated source 비커밋/로컬·CI 운영 규칙은 docs/api/jooq-codegen-policy.md 를 따른다.
      generated jOOQ 클래스는 직접 수정하지 않는다 (jooqGenerate 재실행으로 재생성).
      generated-only 루트는 실행 시 전량 삭제 후 재생성될 수 있으므로 수기 작성 소스를 두지 않는다.
      상세 운영 정책은 docs/api/jooq-codegen-policy.md 참조.
    stacks: [springboot]
  - id: SB-017
    rule: |
      모듈 간 의존성 규칙.
      최상위 패키지 루트는 global/ 과 domain/ 으로만 정규화한다.
      global/은 응답, 예외, config, security 같은 횡단 관심사를 두는 공용 루트이며 domain/에 의존하면 안 된다.
      다른 모듈의 domain/ 및 repository/ 패키지를 직접 import하지 않는다.
      모듈 간 조회는 해당 모듈의 service/ 를 통해서만 접근한다.
      허용된 모듈 의존 방향: auth→organization, worklog→organization/tag, file→worklog/organization, notification→organization, dashboard→organization/worklog/notification.
      dashboard는 query-only 조합 계층으로 유지하며 다른 도메인의 상태 변경을 직접 소유하지 않는다.
    stacks: [springboot]
  - id: SB-018
    rule: |
      Controller Docs 인터페이스 패턴.
      모든 컨트롤러는 Swagger 명세를 담당하는 Docs 인터페이스를 구현한다.
      인터페이스 네이밍: {Module}ControllerDocs (예: AuthControllerDocs, WorklogControllerDocs).
      동일 패키지에 복수 Controller가 있거나 `Internal*Controller`처럼 1:1 대응이 필요한 경우 `{ControllerClassName}Docs` 네이밍을 허용한다.
      배치: 구현체 Controller와 동일한 controller/ 패키지.

      인터페이스({Module}ControllerDocs)가 담당하는 어노테이션:
        - 클래스: @Tag(name, description)
        - 메서드: @Operation(summary, description), @ApiResponses, @SecurityRequirement
        - 파라미터: @Parameter — Security 파라미터(CustomUserPrincipal)는 @Parameter(hidden = true)로 숨김

      구현체({Module}Controller)가 담당하는 어노테이션:
        - 클래스: @RestController, @RequestMapping, @RequiredArgsConstructor
        - 메서드: @GetMapping / @PostMapping / @PutMapping / @PatchMapping / @DeleteMapping, @PreAuthorize, @Override
        - 파라미터: @Valid, @RequestBody, @PathVariable, @RequestParam, @AuthenticationPrincipal

      OpenAPI 보안 스킴(bearerAuth)은 global/config/OpenApiConfig.java에서 전역 등록한다.
    stacks: [springboot]
  - id: SB-019
    rule: |
      패키지 canonicalization 규칙.
      공통 보안 설정, JWT 필터, CustomUserPrincipal, 보안 어노테이션은 global/security/ 가 소유한다.
      auth 도메인은 로그인, 토큰 발급/재발급, 로그아웃 같은 인증 유스케이스와 정책만 소유한다.
      organization 도메인만 domain/organization/<feature>/<layer> 구조를 사용한다.
      다른 도메인은 domain/<module>/<layer> 기준을 유지한다.
      domain 하위 DTO는 request/, response/ 로 분리하지 않고 dto/ 단일 패키지로 둔다.
      dto/ 는 controller/, service/, repository/ 와 동등한 계층에 둔다.
      Query DTO, Request DTO, Response DTO 는 모두 각 도메인(또는 organization feature) 아래 dto/ 에 배치한다.
      Service 가 반환하는 출력 record 와 그 동반 타입은 별도 파일을 만들지 않고 동일 유스케이스의 `{UseCase}ApiDto` 안에 nested record(`Result`, `Result.UserContext` 등) 로 배치해 유스케이스 1:1 파일 매핑을 유지한다.
      Service 입력을 Request DTO 로 직결하지 않고 별도로 조립해야 하는 예외 상황(enrichment/정규화/비 HTTP 호출 경로)에서는 같은 `{UseCase}ApiDto` 안에 `Command` / `Criteria` nested record 를 추가한다. 이 경우에도 별도 dto 파일이나 Service 내부 nested record 로 두지 않는다.
      단, 한 Service 가 다른 Service 에만 노출하는 internal record(예 - `TokenService.IssuedTokens` 처럼 Controller 로 넘어가지 않고 service→service 사이에서만 쓰이는 타입) 는 해당 Service 내부 nested record 로 둘 수 있다. 이 예외는 service→service 내부 contract 에 한정하고, Controller 경계로 드러나는 타입에는 적용하지 않는다.
      internal callback DTO 도 dto/ 아래에 두되 `Internal*Request`, `Internal*Response` naming 으로 구분한다.
      internal callback orchestration service 도 service/ 아래에 두되 `Internal*Service` naming 으로 구분한다.
      controller 는 `Internal*Controller`, DTO 는 `Internal*Request/Response`, service 는 `Internal*Service` naming 을 사용한다.
      이 prefix 규칙은 internal callback controller/DTO/service 와 private integration DTO/service 같은 비공개 내부 연동 타입에 한정한다.
      이번 정리는 문서 canonicalization만 수행하며 실제 코드 이동은 포함하지 않는다.
    stacks: [springboot]
  - id: SB-020
    rule: |
      주석/Javadoc 작성 컨벤션.
      원칙은 "WHY는 주석, WHAT은 코드로 표현한다" 이다. 주석이 필요하다고 느끼면 먼저 네이밍 개선·함수 분해(Extract Method)·테스트 추가로 해결을 시도하고, 그래도 남는 의도/근거만 주석으로 남긴다.

      언어 규칙:
        - 모든 주석과 Javadoc 본문은 한국어로 작성한다. 팀 전원의 모국어가 한국어이고, 도메인 용어(부서/업무 등)를 한국어로 표기하는 편이 의미 전달이 빠르다.
        - 기술 식별자(클래스·메서드·필드·애노테이션·예외명·SQL 키워드 등)와 Javadoc 태그(@param, @return, @throws, @since, @deprecated)는 영어 원문 그대로 유지한다.
        - 외부 인용(라이브러리 버그 제목, 이슈 링크 URL, 법령명 영문 약어 등)은 원문 유지가 더 정확하면 원문을 허용한다.
        - 예 - `/** 활성 부서만 조회한다. 비활성 부서는 제외한다. @throws DepartmentNotFoundException 활성 부서가 없을 때. */`

      Javadoc 필수(공개 경계):
        - Service 의 public 메서드 — 한 줄 요약 Javadoc (`/** ... */`). 복잡한 계약(사전/사후 조건, 예외)이 있으면 @param/@return/@throws 까지 기술한다.
        - ErrorCode enum 의 각 항목 — 발생 조건을 한 줄 주석으로 명시한다.
        - 공개 DTO 가 노출하는 static nested Request/Response 및 from()/of() 메서드 — 의미가 자명하지 않은 경우 한 줄 Javadoc. Command/Criteria 예외 record 를 도입하는 경우에도 동일하게 적용한다.
        - 커스텀 예외(BusinessException 계열) — 어떤 상황에 던지는지 Javadoc 으로 명시.
        - 정책/규칙을 집약하는 유틸(예 - `*Policy`, `*Rule`, `*Criteria`) 의 public static 메서드 — 호출 지점에서 규칙 요약이 필요하므로 한 줄 Javadoc 을 붙인다.
        - @Configuration 클래스의 @Bean 메서드 — 해당 빈의 역할과 등록 이유를 한 줄 Javadoc 으로 남긴다.
        - @Configuration 클래스 자체 — 어떤 횡단 관심사를 묶는 설정인지 클래스 Javadoc 으로 요약한다. 아직 빈 placeholder 라면 "왜 비어 있고 어떤 책임을 이후 수용할 예정인지" 한 줄로 명시한다.
        - Security 인프라 클래스(OncePerRequestFilter, AuthenticationProvider, AccessDecisionVoter 등) — 클래스 책임, SecurityFilterChain 내 위치와 역할을 Javadoc 으로 명시하고, override 한 라이프사이클 메서드(doFilterInternal, attemptAuthentication 등) 와 그로부터 분해된 private helper 에도 Javadoc 을 붙인다. 필터 체인 내 호출 순서·분기·예외 처리 전략을 시그니처만으로는 재구성하기 어렵기 때문이다.
        - Repository 인터페이스의 커스텀 쿼리 메서드 — Spring Data 파생 쿼리(findByX) 든 @Query 든, 반환 집합의 의미/정렬 규칙/예외 조건이 메서드명만으로 자명하지 않으면 한 줄 Javadoc 을 붙인다. 단순 CrudRepository/JpaRepository 기본 메서드 상속은 제외.
        - JPA/Redis 엔티티의 정적 팩토리 메서드(issue, create, of 등) — 생성 시 요구되는 invariant 와 호출 시점을 한 줄 Javadoc 으로 남긴다.
        - 로직이 있는 @Override 메서드 — 단순 1줄 위임이 아닌 경우 상위 계약의 이름·시그니처만으로는 추가된 책임/분기/예외 처리 전략을 파악하기 어려우므로 Javadoc 을 붙인다. OncePerRequestFilter.doFilterInternal 처럼 프레임워크가 호출 주체인 경우 특히 필수.
        - 분기/필터링/조립/try-catch 로직을 포함하는 private helper — 메서드명만으로는 걸러내는 케이스와 통과시키는 케이스, 호출 순서, 예외 흡수 정책을 재구성하기 어려우므로 Javadoc 을 붙인다. 위임 호출 체인의 각 단계 헬퍼도 여기에 포함된다.
        - 외부 라이브러리 객체를 가공/조립하는 빌더성 helper — 선택한 API 가 왜 필요한지, 비자명한 설계 결정이 있다면 그 맥락을 Javadoc 으로 함께 기록한다.

      Javadoc 생략 허용:
        - Controller 메서드 — Swagger `@Operation(summary, description)` 이 SB-018 `*ControllerDocs` 인터페이스에 이미 존재하므로 구현체에 Javadoc 을 중복 작성하지 않는다.
        - 단순 위임만 있는 `@Override` — `return super.xxx(...)` 또는 `return delegate.xxx(...)` 같이 한 줄 위임만 수행하는 경우에 한한다. 조건 분기, try-catch, 필터링, 조립, 추가 상태 변경 등이 들어가면 더 이상 생략 대상이 아니다.
        - Entity 필드/롬복 생성자/단순 getter·setter — 네이밍과 어노테이션이 자명한 경우.

      WHY 주석 권장 상황:
        - 비즈니스 규칙의 근거(법령/사내 정책/도메인 제약)가 코드만으로 드러나지 않을 때 — 근거 문서·이슈 번호를 함께 표기.
        - 외부 라이브러리 버그/제약 우회 — 라이브러리 버전과 이슈 링크 병기.
        - 직관에 반하는 성능/순서 선택, 비자명한 알고리즘 선택.
        - 임시 예외 처리/워크어라운드 — 반드시 해제 조건을 함께 기술.

      정책 중복 회피:
        - 같은 규칙(예 - 공통 응답 봉투 래핑 제외 조건)이 두 지점 이상에서 구현되어야 하는 경우 Policy 전용 유틸 클래스(`*Policy` 네이밍)로 추출하고, 호출 지점은 유틸 메서드 한 번만 부른다.
        - 호출 지점 메서드 이름(`shouldWrap`, `isAllowed` 등) 이 의도를 전달하므로 호출측에는 별도 WHAT 주석을 추가하지 않는다.

      금지:
        - WHAT 주석(코드를 한국어로 재서술하는 주석). 예 - `// user 목록을 가져온다` 같은 주석.
        - 주석 처리된 코드 블록 방치. 삭제하거나 이유를 병기.
        - 닫는 괄호 꼬리 주석(`} // end for`), 박스형 별표 장식 주석.
        - 오래되어 코드와 불일치하는 주석. 코드 변경 시 주석도 함께 갱신한다.
        - 사내 ADR/컨벤션 식별자(예 - GEN-004, SB-007, SB-018, ADR-001) 를 주석에서 참조하지 않는다. reader 가 별도 문서를 열지 않아도 코드만 읽고 이해할 수 있도록, 식별자 대신 그 결정의 배경이나 제약을 한국어로 풀어 적는다. 외부 인용(라이브러리 이슈 번호, 법령 조항 등)은 이 규칙에서 제외한다.

      이번 컨벤션 도입은 신규·변경 코드에만 적용하며 기존 파일의 주석 소급 추가는 포함하지 않는다.
