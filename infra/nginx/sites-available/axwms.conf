# EC2 systemd nginx 의 단일 진입점 conf.
# include 대상: /etc/nginx/sites-enabled/axwms.conf (sites-available -> symlink)
# 근거: ADR-010(외부 진입 포트 / path-based 라우팅), ADR-012(Let's Encrypt), ADR-014(web 자동배포 편입), ADR-015(저장소 편입 + 동기화 정책), ADR-018(per-IP rate limit).
# production: 80(ACME + redirect) / 443(HTTPS) — 대중 노출
# staging:    8080(redirect) / 8443(HTTPS) — 같은 EC2 의 +1 오프셋 환경

# rate limit / connection limit / slowloris timeout / server_tokens — http 컨텍스트로 진입.
include /etc/nginx/snippets/rate-limit.conf;

upstream axwms_web_prod      { server 127.0.0.1:8000; }
upstream axwms_web_staging   { server 127.0.0.1:8001; }
upstream axwms_api_prod      { server 127.0.0.1:8100; }
upstream axwms_api_staging   { server 127.0.0.1:8101; }
upstream axwms_ai_prod       { server 127.0.0.1:8200; }
upstream axwms_ai_staging    { server 127.0.0.1:8201; }

# ---------- production: 80 (ACME challenge + HTTPS redirect) ----------
server {
    listen 80;
    server_name k14s209.p.ssafy.io;

    # Let's Encrypt HTTP-01 challenge 경로 (ADR-012)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- production: 443 (HTTPS) ----------
server {
    listen 443 ssl http2;
    server_name k14s209.p.ssafy.io;

    ssl_certificate     /etc/letsencrypt/live/k14s209.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/k14s209.p.ssafy.io/privkey.pem;

    # 보안 헤더(최소 셋, 추후 별 MR 로 확장)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # per-IP 동시 connection 상한 (ADR-018 — NAT 가정 30명)
    limit_conn perip 100;

    # path-based 라우팅 (ADR-010 #1, ADR-014). 순서 중요 — 더 구체적인 prefix 가 위로.
    # /internal/** 은 같은 EC2 의 ai → api 콜백 전용 경로. 외부 노출 차단.
    # api SecurityConfig 가 /internal/** 을 인증 면제하므로 외부 차단이 유일한 방어선이다.
    # api 의 server.servlet.context-path 가 /api 라서 외부 URL 기준으로 두 경로를 모두 막는다:
    #   - /api/internal/...  : 외부 클라이언트가 실제로 닿을 수 있는 경로
    #   - /internal/...      : 라우팅 변경 / 우회 시도 대비 다중 방어
    location /api/internal/ {
        return 404;
    }
    location /internal/ {
        return 404;
    }
    # /api/auth/ 는 brute-force 표면이라 별도 zone (ADR-018)
    location /api/auth/ {
        limit_req zone=req_auth burst=30 nodelay;
        proxy_pass http://axwms_api_prod;
        include /etc/nginx/snippets/proxy-headers.conf;
    }
    location /api/worklogs/search/semantic {
        limit_req zone=req_general burst=200 nodelay;
        # LightRAG query 는 API 내부에서 AI 를 경유하므로 `/api/` 기본 대기시간보다 길게 둔다.
        proxy_read_timeout 180s;
        proxy_pass http://axwms_api_prod;
        include /etc/nginx/snippets/proxy-headers.conf;
    }
    location /api/ {
        limit_req zone=req_general burst=200 nodelay;
        proxy_pass http://axwms_api_prod;
        include /etc/nginx/snippets/proxy-headers.conf;
    }
    location /ai/ {
        limit_req zone=req_ai burst=60 nodelay;
        # LLM 응답 대기 — 기본 60s 가 짧음 (ADR-018)
        proxy_read_timeout 180s;
        proxy_pass http://axwms_ai_prod;
        include /etc/nginx/snippets/proxy-headers.conf;
    }
    location / {
        limit_req zone=req_general burst=200 nodelay;
        proxy_pass http://axwms_web_prod;
        include /etc/nginx/snippets/proxy-headers.conf;
    }
}

# ---------- staging: 8080 -> 8443 redirect ----------
server {
    listen 8080;
    server_name k14s209.p.ssafy.io;

    location / {
        return 301 https://$host:8443$request_uri;
    }
}

# ---------- staging: 8443 (HTTPS) ----------
server {
    listen 8443 ssl http2;
    server_name k14s209.p.ssafy.io;

    ssl_certificate     /etc/letsencrypt/live/k14s209.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/k14s209.p.ssafy.io/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # per-IP 동시 connection 상한 (ADR-018 — NAT 가정 30명)
    limit_conn perip 100;

    # /internal/** 은 같은 EC2 의 ai → api 콜백 전용 경로. 외부 노출 차단.
    # api SecurityConfig 가 /internal/** 을 인증 면제하므로 외부 차단이 유일한 방어선이다.
    # api 의 server.servlet.context-path 가 /api 라서 외부 URL 기준으로 두 경로를 모두 막는다.
    location /api/internal/ {
        return 404;
    }
    location /internal/ {
        return 404;
    }
    location /api/auth/ {
        limit_req zone=req_auth burst=30 nodelay;
        proxy_pass http://axwms_api_staging;
        include /etc/nginx/snippets/proxy-headers.conf;
    }
    location /api/worklogs/search/semantic {
        limit_req zone=req_general burst=200 nodelay;
        proxy_read_timeout 180s;
        proxy_pass http://axwms_api_staging;
        include /etc/nginx/snippets/proxy-headers.conf;
    }
    location /api/ {
        limit_req zone=req_general burst=200 nodelay;
        proxy_pass http://axwms_api_staging;
        include /etc/nginx/snippets/proxy-headers.conf;
    }
    location /ai/ {
        limit_req zone=req_ai burst=60 nodelay;
        proxy_read_timeout 180s;
        proxy_pass http://axwms_ai_staging;
        include /etc/nginx/snippets/proxy-headers.conf;
    }
    location / {
        limit_req zone=req_general burst=200 nodelay;
        proxy_pass http://axwms_web_staging;
        include /etc/nginx/snippets/proxy-headers.conf;
    }
}
