# nginx per-IP rate limit / connection limit + slowloris timeout SSOT.
# include 대상: /etc/nginx/snippets/rate-limit.conf
# axwms.conf 의 server 블록 밖(= http 컨텍스트) 에서 include 한다.
# 근거: ADR-018, OPS-020.

# ---------- per-IP connection 동시 수 제한 ----------
# 한 IP 가 동시에 열 수 있는 connection 상한.
# SSAFY 캠퍼스 NAT 가정: 한 외부 IP 뒤에 약 30명 동시 사용자 + HTTP/1.1 fallback 마진까지 흡수.
limit_conn_zone $binary_remote_addr zone=perip:10m;

# ---------- per-IP request rate ----------
# 모든 zone 키는 IP 당 카운터 (`$binary_remote_addr`). 같은 IP 뒤 다수 유저면 공동 영향.
# 값 가정: SSAFY 캠퍼스 NAT 환경에서 한 외부 IP 뒤 약 30명 동시 사용자.

# 일반 라우트 — 30명 × 평균 1 req/s(실시간 알림/polling 포함) + 첫 페이지 로드 burst 흡수
limit_req_zone $binary_remote_addr zone=req_general:10m rate=30r/s;

# 인증 경로 — brute-force 페이스 cap 은 그대로(5r/m). burst 만 30명 동시 로그인 흡수
limit_req_zone $binary_remote_addr zone=req_auth:10m rate=5r/m;

# AI 경로 — Gemini 외부 유료 호출. 30명 × 분당 1회 검색 가정
limit_req_zone $binary_remote_addr zone=req_ai:10m rate=30r/m;

# ---------- 응답 코드 ----------
# 기본 503 대신 429 (Too Many Requests) — client/proxy 해석 명확.
limit_req_status 429;
limit_conn_status 429;

# ---------- slowloris / 느린 연결 고갈 대응 ----------
# `keepalive_timeout` 은 Debian/Ubuntu nginx.conf 가 이미 65s 로 명시해 두 곳에서 정의하면
# `directive is duplicate` 로 nginx -t 가 실패한다. 본 snippet 에선 정의하지 않고,
# 필요 시 운영자가 nginx.conf 의 값을 조정한다(별 운영 절차).
client_header_timeout 10s;
client_body_timeout   10s;
send_timeout          10s;

# ---------- nginx 버전 노출 차단 ----------
# nginx.conf 가 명시한 경우 충돌하므로 운영자가 nginx.conf 에서 활성 정의되어 있지 않은지 확인 후 활성화.
server_tokens off;
