services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${DB_NAME:-postgres}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:?POSTGRES_HOST_PORT required (env-specific offset, e.g. 8300/8301)}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-postgres}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:?REDIS_HOST_PORT required (env-specific offset, e.g. 8400/8401)}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.17.1
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "${QDRANT_HOST_PORT:?QDRANT_HOST_PORT required (env-specific offset, e.g. 8500/8501)}:6333"
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?NEO4J_PASSWORD required}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL_SIZE:-512m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX_SIZE:-1G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE_SIZE:-512m}
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    ports:
      - "${NEO4J_BOLT_HOST_PORT:?NEO4J_BOLT_HOST_PORT required (env-specific offset, e.g. 8600/8601)}:7687"
      - "${NEO4J_HTTP_HOST_PORT:?NEO4J_HTTP_HOST_PORT required (env-specific offset, e.g. 8602/8603)}:7474"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "NEO4J_USERNAME=\"$${NEO4J_AUTH%%/*}\" NEO4J_PASSWORD=\"$${NEO4J_AUTH#*/}\" cypher-shell 'RETURN 1' >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    image: ${API_IMAGE}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV required (staging | production) — Spring profile selector}
      SERVER_PORT: 8100
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-postgres}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_WORKLOG_SEARCH_ENABLED: ${AI_WORKLOG_SEARCH_ENABLED:-true}
      AI_WORKLOG_SEARCH_BASE_URL: http://ai:8200/ai
      AI_WORKLOG_SEARCH_CONNECT_TIMEOUT: ${AI_WORKLOG_SEARCH_CONNECT_TIMEOUT:-2s}
      AI_WORKLOG_SEARCH_READ_TIMEOUT: ${AI_WORKLOG_SEARCH_READ_TIMEOUT:-10s}
      AI_FILE_SUMMARY_ENABLED: ${AI_FILE_SUMMARY_ENABLED:-true}
      AI_FILE_SUMMARY_BASE_URL: http://ai:8200/ai
      AI_FILE_SUMMARY_CONNECT_TIMEOUT: ${AI_FILE_SUMMARY_CONNECT_TIMEOUT:-2s}
      AI_FILE_SUMMARY_READ_TIMEOUT: ${AI_FILE_SUMMARY_READ_TIMEOUT:-3s}
      AI_WORKLOG_PIPELINE_ENABLED: ${AI_WORKLOG_PIPELINE_ENABLED:-true}
      AI_WORKLOG_PIPELINE_BASE_URL: ${AI_WORKLOG_PIPELINE_BASE_URL:-http://ai:8200/ai}
      AI_WORKLOG_PIPELINE_CONNECT_TIMEOUT: ${AI_WORKLOG_PIPELINE_CONNECT_TIMEOUT:-2s}
      AI_WORKLOG_PIPELINE_READ_TIMEOUT: ${AI_WORKLOG_PIPELINE_READ_TIMEOUT:-3s}
      AI_WORKLOG_LIGHT_INDEX_ENABLED: ${AI_WORKLOG_LIGHT_INDEX_ENABLED:-true}
      AI_WORKLOG_LIGHT_INDEX_BASE_URL: ${AI_WORKLOG_LIGHT_INDEX_BASE_URL:-http://ai:8200/ai}
      AI_WORKLOG_LIGHT_INDEX_CONNECT_TIMEOUT: ${AI_WORKLOG_LIGHT_INDEX_CONNECT_TIMEOUT:-2s}
      AI_WORKLOG_LIGHT_INDEX_READ_TIMEOUT: ${AI_WORKLOG_LIGHT_INDEX_READ_TIMEOUT:-300s}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-3600000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-1209600000}
      
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BASE_PREFIX: ${AWS_S3_BASE_PREFIX}
      AWS_S3_PUBLIC_BASE_URL: ${AWS_S3_PUBLIC_BASE_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      # 프로필 이미지 임시객체 정리 cron. 컨테이너 TZ 를 Asia/Seoul 로 두면 application.yml 기본값(0 20 22 * * *) 이 KST 22:20.
      TZ: ${API_TZ:-Asia/Seoul}
      PROFILE_IMAGE_CLEANUP_CRON: ${PROFILE_IMAGE_CLEANUP_CRON:-0 20 22 * * *}
      PROFILE_IMAGE_TEMP_PREFIX: ${PROFILE_IMAGE_TEMP_PREFIX:-temp/}
      PROFILE_IMAGE_RETENTION_DAYS: ${PROFILE_IMAGE_RETENTION_DAYS:-1}
      SPRING_PROFILES_ACTIVE: ${APP_ENV:?APP_ENV required (staging | production) — Spring profile selector}
      AUTH_CORS_ALLOWED_ORIGINS: ${AUTH_CORS_ALLOWED_ORIGINS:-}
      AUTH_CORS_ALLOWED_ORIGIN_PATTERNS: ${AUTH_CORS_ALLOWED_ORIGIN_PATTERNS:-}

    ports:
      - "127.0.0.1:${API_HOST_PORT:?API_HOST_PORT required (env-specific offset, e.g. 8100/8101)}:8100"
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE}
    environment:
      NODE_ENV: production
      PORT: 8000
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:?WEB_HOST_PORT required (env-specific offset, e.g. 8000/8001)}:8000"
    restart: unless-stopped

  ai:
    image: ${AI_IMAGE}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${APP_ENV:-deploy}
      API_PREFIX: /ai
      HOST: 0.0.0.0
      PORT: 8200
      LOG_LEVEL: ${AI_LOG_LEVEL:-INFO}
      # 같은 compose network 의 postgres/redis 로 붙는다. ADR-010 의 127.0.0.1 바인딩은 외부 노출 정책이고
      # 서비스 간 통신은 컨테이너 네트워크 hostname 을 그대로 사용한다.
      PGVECTOR_DSN: postgresql://${DB_USERNAME:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-postgres}
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      LIGHTRAG_QDRANT_URL: http://qdrant:6333
      LIGHTRAG_QDRANT_API_KEY: ${LIGHTRAG_QDRANT_API_KEY:-}
      API_BASE_URL: http://api:8100
      # ai 가 api 를 호출할 때 쓰는 JWT 검증 키. api 와 동일 시크릿이어야 한다.
      JWT_SECRET: ${JWT_SECRET}
      # Gemini — 실제 키는 서버 .env / GitLab Variables 로만 주입한다 (ADR-003 / GEN-002).
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_REQUEST_TIMEOUT_SECONDS: ${GEMINI_REQUEST_TIMEOUT_SECONDS:-30}
      GEMINI_MAX_RETRIES: ${GEMINI_MAX_RETRIES:-3}
      GEMINI_FILE_ACTIVE_POLL_SEC: ${GEMINI_FILE_ACTIVE_POLL_SEC:-2.0}
      GEMINI_FILE_ACTIVE_TIMEOUT_SEC: ${GEMINI_FILE_ACTIVE_TIMEOUT_SEC:-120}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
      CHUNK_THRESHOLD_CHARS: ${CHUNK_THRESHOLD_CHARS:-3000}
      # 파일 AI 요약: api 의 S3 버킷에서 파일 본문을 GET 한다. 같은 자격증명을 공유한다.
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_S3_BASE_PREFIX: ${AWS_S3_BASE_PREFIX}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    ports:
      - "127.0.0.1:${AI_HOST_PORT:?AI_HOST_PORT required (env-specific offset, e.g. 8200/8201)}:8200"
    restart: unless-stopped

  # Celery worker — ai FastAPI 가 task.delay() 로 큐에 적재한 작업을 실제로 처리하는 별도 프로세스.
  # 같은 이미지를 사용하되 command 만 uvicorn 대신 celery worker 로 override 한다.
  # 환경변수는 ai 서비스와 동일하게 유지해야 settings 로드/Gemini/S3/콜백 호출이 모두 작동한다.
  ai_worker:
    image: ${AI_IMAGE}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${APP_ENV:-deploy}
      LOG_LEVEL: ${AI_LOG_LEVEL:-INFO}
      PGVECTOR_DSN: postgresql://${DB_USERNAME:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-postgres}
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      LIGHTRAG_QDRANT_URL: http://qdrant:6333
      LIGHTRAG_QDRANT_API_KEY: ${LIGHTRAG_QDRANT_API_KEY:-}
      API_BASE_URL: http://api:8100
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_REQUEST_TIMEOUT_SECONDS: ${GEMINI_REQUEST_TIMEOUT_SECONDS:-30}
      GEMINI_MAX_RETRIES: ${GEMINI_MAX_RETRIES:-3}
      GEMINI_FILE_ACTIVE_POLL_SEC: ${GEMINI_FILE_ACTIVE_POLL_SEC:-2.0}
      GEMINI_FILE_ACTIVE_TIMEOUT_SEC: ${GEMINI_FILE_ACTIVE_TIMEOUT_SEC:-120}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
      CHUNK_THRESHOLD_CHARS: ${CHUNK_THRESHOLD_CHARS:-3000}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_S3_BASE_PREFIX: ${AWS_S3_BASE_PREFIX}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    command: ["celery", "-A", "app.task.celery_app", "worker", "--loglevel=INFO"]
    restart: unless-stopped

volumes:
  postgres-data:
    name: axwms-${APP_ENV:?APP_ENV required for volume name isolation}-postgres-data
  qdrant-data:
    name: axwms-${APP_ENV:?APP_ENV required for volume name isolation}-qdrant-data
  neo4j-data:
    name: axwms-${APP_ENV:?APP_ENV required for volume name isolation}-neo4j-data
  neo4j-logs:
    name: axwms-${APP_ENV:?APP_ENV required for volume name isolation}-neo4j-logs
