name: axwms-local

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: axwms-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - axwms-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: axwms-redis
    ports:
      - "6379:6379"
    volumes:
      - axwms-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: axwms-qdrant
    ports:
      - "6333:6333"
    volumes:
      - axwms-qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5.26-community
    container_name: axwms-neo4j
    environment:
      NEO4J_AUTH: neo4j/neo4j-local-password
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - axwms-neo4j-data:/data
      - axwms-neo4j-logs:/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p neo4j-local-password 'RETURN 1' >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  axwms-postgres-data:
  axwms-redis-data:
  axwms-qdrant-data:
  axwms-neo4j-data:
  axwms-neo4j-logs:
