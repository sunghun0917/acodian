name: axwms-local

services:
  ai: &local-ai
    image: axwms-ai:local
    build:
      context: ../ai
      dockerfile: Dockerfile
    env_file:
      - ../ai/.env
    environment:
      HOST: 0.0.0.0
      PORT: 8200
      API_BASE_URL: http://host.docker.internal:8100
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      LIGHTRAG_QDRANT_URL: http://qdrant:6333
      LIGHTRAG_WORKING_DIR: /app/data/lightrag-v3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8200:8200"
    volumes:
      - axwms-lightrag-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  ai_worker:
    <<: *local-ai
    ports: []
    command: ["celery", "-A", "app.task.celery_app", "worker", "--loglevel=INFO", "--concurrency=1", "--hostname=general@%h", "--queues=ai_general"]

  ai_index_worker:
    <<: *local-ai
    ports: []
    command: ["celery", "-A", "app.task.celery_app", "worker", "--loglevel=INFO", "--concurrency=1", "--hostname=index@%h", "--queues=worklog_index"]

  postgres:
    image: pgvector/pgvector:pg17
    container_name: axwms-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - axwms-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10.0-alpine
    container_name: axwms-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - axwms-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: axwms-qdrant
    ports:
      - "6333:6333"
    volumes:
      - axwms-qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5.26-community
    container_name: axwms-neo4j
    environment:
      NEO4J_AUTH: neo4j/neo4j-local-password
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - axwms-neo4j-data:/data
      - axwms-neo4j-logs:/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "NEO4J_USERNAME=\"$${NEO4J_AUTH%%/*}\" NEO4J_PASSWORD=\"$${NEO4J_AUTH#*/}\" cypher-shell 'RETURN 1' >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    command:
      - "--model-id"
      - "bongsoo/klue-cross-encoder-v1"
      - "--max-batch-tokens"
      - "2048"
      - "--max-client-batch-size"
      - "64"
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - axwms-reranker-cache:/data
    restart: unless-stopped

volumes:
  axwms-lightrag-data:
  axwms-postgres-data:
  axwms-redis-data:
  axwms-qdrant-data:
  axwms-neo4j-data:
  axwms-neo4j-logs:
  axwms-reranker-cache:
