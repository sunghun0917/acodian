spring:
  application:
    name: ax-wms-api

  profiles:
    default: local

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8100}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/api}
  forward-headers-strategy: framework

springdoc:
  use-fqn: true
  api-docs:
    path: /api-docs
    version: OPENAPI_3_0
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

jwt:
  secret: ${JWT_SECRET:default-dev-secret-key-must-be-changed-in-production}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:3600000}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:1209600000}

auth:
  refresh-cookie:
    name: ${AUTH_REFRESH_COOKIE_NAME:refreshToken}
    path: ${AUTH_REFRESH_COOKIE_PATH:/api/auth}
    secure: ${AUTH_REFRESH_COOKIE_SECURE:true}
    same-site: ${AUTH_REFRESH_COOKIE_SAMESITE:Strict}
    domain: ${AUTH_REFRESH_COOKIE_DOMAIN:}
    max-age-seconds-override: ${AUTH_REFRESH_COOKIE_MAX_AGE:}
  cors:
    allowed-origins: ${AUTH_CORS_ALLOWED_ORIGINS:}
    allowed-origin-patterns: ${AUTH_CORS_ALLOWED_ORIGIN_PATTERNS:}

---
spring:
  config:
    activate:
      on-profile: local

auth:
  refresh-cookie:
    secure: false
    same-site: Lax
  cors:
    allowed-origin-patterns: "http://localhost:*"
