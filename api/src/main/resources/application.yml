spring:
  application:
    name: ax-wms-api

  profiles:
    default: local

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 110MB

server:
  port: ${SERVER_PORT:8100}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/api}
  forward-headers-strategy: framework

springdoc:
  use-fqn: true
  api-docs:
    path: /api-docs
    version: OPENAPI_3_0
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

jwt:
  secret: ${JWT_SECRET:default-dev-secret-key-must-be-changed-in-production}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:3600000}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:1209600000}

storage:
  s3:
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_REGION}
    base-prefix: ${AWS_S3_BASE_PREFIX}
    public-base-url: ${AWS_S3_PUBLIC_BASE_URL}
    access-key-id: ${AWS_ACCESS_KEY_ID}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY}
  profile-image:
    cleanup:
      cron: ${PROFILE_IMAGE_CLEANUP_CRON:0 20 22 * * *}
      temp-prefix: ${PROFILE_IMAGE_TEMP_PREFIX:temp/}
      retention-days: ${PROFILE_IMAGE_RETENTION_DAYS:1}
worklog:
  files:
    max-count: ${WORKLOG_FILE_MAX_COUNT:10}
    max-file-size-bytes: ${WORKLOG_FILE_MAX_SIZE_BYTES:10485760}
    max-total-size-bytes: ${WORKLOG_FILE_MAX_TOTAL_SIZE_BYTES:104857600}
ai:
  worklog-search:
    enabled: ${AI_WORKLOG_SEARCH_ENABLED:false}
    base-url: ${AI_WORKLOG_SEARCH_BASE_URL:http://localhost:8000/ai}
    connect-timeout: ${AI_WORKLOG_SEARCH_CONNECT_TIMEOUT:60s}
    read-timeout: ${AI_WORKLOG_SEARCH_READ_TIMEOUT:60s}
  file-summary:
    enabled: ${AI_FILE_SUMMARY_ENABLED:false}
    base-url: ${AI_FILE_SUMMARY_BASE_URL:http://localhost:8000/ai}
    connect-timeout: ${AI_FILE_SUMMARY_CONNECT_TIMEOUT:2s}
    read-timeout: ${AI_FILE_SUMMARY_READ_TIMEOUT:3s}
  worklog-pipeline:
    enabled: ${AI_WORKLOG_PIPELINE_ENABLED:true}
    base-url: ${AI_WORKLOG_PIPELINE_BASE_URL:http://localhost:8000/ai}
    connect-timeout: ${AI_WORKLOG_PIPELINE_CONNECT_TIMEOUT:2s}
    read-timeout: ${AI_WORKLOG_PIPELINE_READ_TIMEOUT:3s}
  worklog-polish:
    base-url: ${AI_WORKLOG_POLISH_BASE_URL:http://localhost:8000/ai}
    connect-timeout: ${AI_WORKLOG_POLISH_CONNECT_TIMEOUT:2s}
    read-timeout: ${AI_WORKLOG_POLISH_READ_TIMEOUT:10s}
  worklog-light-index:
    enabled: ${AI_WORKLOG_LIGHT_INDEX_ENABLED:true}
    base-url: ${AI_WORKLOG_LIGHT_INDEX_BASE_URL:http://localhost:8000/ai}
    connect-timeout: ${AI_WORKLOG_LIGHT_INDEX_CONNECT_TIMEOUT:2s}
    read-timeout: ${AI_WORKLOG_LIGHT_INDEX_READ_TIMEOUT:300s}

notification:
  worklog-overdue-reminder:
    cron: ${NOTIFICATION_WORKLOG_OVERDUE_REMINDER_CRON:0 10 9 * * *}
  worklog-due-soon-reminder:
    cron: ${NOTIFICATION_WORKLOG_DUE_SOON_REMINDER_CRON:0 0 9 * * *}
  read-cleanup:
    cron: ${NOTIFICATION_READ_CLEANUP_CRON:0 40 22 * * *}
  stream:
    key: ${NOTIFICATION_STREAM_KEY:notifications:stream}
    poll-timeout-millis: ${NOTIFICATION_STREAM_POLL_TIMEOUT_MILLIS:2000}
  sse:
    timeout-millis: ${NOTIFICATION_SSE_TIMEOUT_MILLIS:1800000}
    heartbeat-delay-millis: ${NOTIFICATION_SSE_HEARTBEAT_DELAY_MILLIS:25000}

auth:
  refresh-cookie:
    name: ${AUTH_REFRESH_COOKIE_NAME:refreshToken}
    path: ${AUTH_REFRESH_COOKIE_PATH:/api/auth}
    secure: ${AUTH_REFRESH_COOKIE_SECURE:true}
    same-site: ${AUTH_REFRESH_COOKIE_SAMESITE:Strict}
    domain: ${AUTH_REFRESH_COOKIE_DOMAIN:}
    max-age-seconds-override: ${AUTH_REFRESH_COOKIE_MAX_AGE:}
  cors:
    allowed-origins: ${AUTH_CORS_ALLOWED_ORIGINS:}
    allowed-origin-patterns: ${AUTH_CORS_ALLOWED_ORIGIN_PATTERNS:}

logging:
  level:
    com.ibank.axwms.global.logging.LayerTraceAspect: DEBUG
  pattern:
    level: "traceId:%X{traceId:-none} userId:%X{userId:-none} role:%X{roleCode:-none} %5p"
